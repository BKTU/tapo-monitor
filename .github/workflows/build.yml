name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk monitor-${{ github.run_number }}.apk
          cp app/build/outputs/apk/release/app-release.apk monitor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: monitor-apk
          path: monitor-*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" "monitor-${{ github.run_number }}.apk" monitor.apk \
            --title "監視器 v1.0.${{ github.run_number }}" \
            --notes "自動編譯的 APK，下載後直接安裝。" --latest
